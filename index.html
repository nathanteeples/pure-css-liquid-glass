<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pure CSS Liquid Glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="scene">
      <header class="hero">
        <p class="eyebrow">Experimental UI</p>
        <h1>Liquid glass inspired by real-world optics.</h1>
        <p>
          The translucent slab reacts to your cursor and the controls below so you can
          explore how light refracts through layers of color.
        </p>
      </header>

      <section class="glass-lab">
        <div class="glass-card">
          <div class="glass-card__inner">
            <p>Hover or focus to feel the viscosity.</p>
            <div class="glass-card__stats">
              <div>
                <span>Refraction</span>
                <strong>1.52</strong>
              </div>
              <div>
                <span>Thickness</span>
                <strong>14mm</strong>
              </div>
            </div>
          </div>
        </div>

        <form class="controls" aria-label="Liquid glass controls">
          <label class="control control--slider">
            Viscosity
            <input type="range" min="0" max="100" value="64" />
          </label>

          <label class="control control--toggle">
            <input type="checkbox" checked />
            <span>Surface sheen</span>
          </label>

          <fieldset class="control control--radio">
            <legend>Hue shift</legend>
            <label>
              <input type="radio" name="hue" checked />
              Aqua
            </label>
            <label>
              <input type="radio" name="hue" />
              Magenta
            </label>
            <label>
              <input type="radio" name="hue" />
              Lime
            </label>
          </fieldset>
        </form>
      </section>
    </main>
  </body>
</html>
